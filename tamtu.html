<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Tâm tư</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ffd1dc, #ffe4ec);
    overflow: hidden;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #textBox {
    width: 90%;
    max-width: 420px;
    text-align: center;
    font-size: 24px;
    color: #880e4f;
    line-height: 1.6;
    z-index: 5;
  }

  .char {
    display: inline-block;
    white-space: pre;
    opacity: 0;
    transform: translateY(20px);
    transition: 0.35s ease;
  }

  .char.show {
    opacity: 1;
    transform: translateY(0);
  }

  .char.explode {
    opacity: 0;
    transform:
      translate(
        calc(-80px + 160px * var(--x)),
        calc(-80px + 160px * var(--y))
      )
      rotate(25deg);
  }

  .heart {
    position: absolute;
    bottom: -30px;
    color: rgba(255,105,180,0.35);
    animation: bayLen 14s linear infinite;
    pointer-events: none;
  }

  @keyframes bayLen {
    from { transform: translateY(0); opacity: 1; }
    to { transform: translateY(-120vh); opacity: 0; }
  }
</style>
</head>

<body>

<div id="textBox"></div>

<script>
/* ===== 15 DÒNG – BẠN TỰ SỬA ===== */
const lines = [
  "Có những điều tôi đã nghĩ rất lâu…",
  "Nhưng lại không đủ can đảm để nói ra.",
  "Không phải vì không còn tình cảm,",
  "Mà vì sợ khó xử.",
  "Có lúc tôi muốn giữ lại,",
  "Có lúc lại nghĩ nên buông tay.",
  "Dù sao cậu cũng là,",
  "Người có tài có sắc, mỹ miệu như hóa",
  "Còn tôi chỉ là kẻ thất bại.",
  "Không đủ tốt để níu kéo,",
  "Không đủ tệ để quên đi.",
  "Mọi thứ cứ lưng chừng như thế.",
  "Nếu được quay về ban đầu,",
  "Tôi vẫn sẽ chọn cảm xúc ấy.",
  "Chỉ là… đến muộn."
];

const box = document.getElementById("textBox");
let lineIndex = 0;
let charIndex = 0;

function typeLine() {
  if (charIndex < lines[lineIndex].length) {
    const span = document.createElement("span");
    span.className = "char";
    span.textContent = lines[lineIndex][charIndex];
    box.appendChild(span);

    requestAnimationFrame(() => span.classList.add("show"));
    charIndex++;
    setTimeout(typeLine, 18); // tốc độ chữ
  } else {
    setTimeout(explodeText, 1600);
  }
}

function explodeText() {
  document.querySelectorAll(".char").forEach(c => {
    c.style.setProperty("--x", Math.random());
    c.style.setProperty("--y", Math.random());
    c.classList.add("explode");
  });

  setTimeout(nextLine, 1200);
}

function nextLine() {
  box.innerHTML = "";
  charIndex = 0;
  lineIndex++;

  if (lineIndex < lines.length) {
    typeLine();
  } else {
    // HẾT TẤT CẢ → CHUYỂN TRANG
    setTimeout(() => {
      window.location.href = "ketthuc.html";
    }, 800);
  }
}

typeLine();

/* ===== TRÁI TIM ===== */
for (let i = 0; i < 16; i++) {
  const h = document.createElement("div");
  h.className = "heart";
  h.innerHTML = "❤";
  h.style.left = Math.random() * 100 + "vw";
  h.style.fontSize = (10 + Math.random() * 18) + "px";
  h.style.animationDelay = (-Math.random() * 14) + "s";
  document.body.appendChild(h);
}
</script>

</body>
</html>
